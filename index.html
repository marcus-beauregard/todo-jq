<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- SPDX-License-Identifier: GPL-2.0-or-later -->
<title>todo</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:420px;margin:3rem auto;padding:0 1rem;color:#222}
 ul{list-style:none;padding:0}
 li{display:flex;gap:.5rem;padding:.4rem 0;border-bottom:1px solid #eee}
 li.done span{text-decoration:line-through;color:#999}
 input[type=text]{width:100%;padding:.5rem;font-size:1rem}
</style>
</head>
<body>
<h1>todo</h1>
<form id="f"><input id="t" type="text" placeholder="what needs doing?" autofocus></form>
<ul id="list"></ul>
<p><small>press Enter to add · <span id="count">0</span> left · <a href="#" id="clear">clear done</a></small></p>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>
var items = JSON.parse(localStorage.getItem('todos') || '[]');
function render(){
  $('#list').empty();
  items.forEach(function(it, i){
    var li = $('<li>').toggleClass('done', it.done)
      .append($('<input type="checkbox">').prop('checked', it.done).on('change', function(){
        items[i].done = this.checked; save();
      }))
      .append($('<span>').text(it.text))
      .append($('<button>').text('x').on('click', function(){
        items.splice(i, 1); save();
      }));
    $('#list').append(li);
  });
  $('#count').text(items.filter(function(x){return !x.done;}).length);
}
function save(){ localStorage.setItem('todos', JSON.stringify(items)); render(); }
$('#f').on('submit', function(e){
  e.preventDefault();
  var v = $('#t').val().trim();
  if(!v) return;
  items.push({text:v, done:false});
  $('#t').val(''); save();
});
$('#clear').on('click', function(e){
  e.preventDefault();
  items = items.filter(function(x){return !x.done;});
  save();
});
render();
</script>
</body>
</html>
